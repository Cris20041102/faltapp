services:
  - type: web
    name: faltapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # pegar la URL de Neon
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET # clave para que cron-job.org dispare los avisos diarios
        generateValue: true
      - key: RESEND_API_KEY # opcional: correo de recuperación (resend.com); sin ella esa opción no aparece
        sync: false
