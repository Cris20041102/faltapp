services:
  - type: web
    name: faltapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # pegar la URL de Neon
      - key: JWT_SECRET
        generateValue: true
