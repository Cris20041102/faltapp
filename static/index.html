<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0118">
  <title>Faltapp</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700&display=swap">
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {} /* modo elegido, antes de pintar */</script>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-screen text-slate-700 antialiased">
  <header class="sticky top-0 z-20 border-b border-fg/10 bg-canvas/70 backdrop-blur-xl">
    <div class="mx-auto flex h-14 max-w-3xl items-center justify-between px-4">
      <a href="#inicio" class="font-display text-xl font-bold tracking-tight text-fg">Faltapp</a>
      <div id="hdr" class="flex items-center gap-3 text-sm"></div>
    </div>
  </header>

  <main id="view" class="mx-auto max-w-3xl px-4 pb-28 pt-5"></main>

  <nav id="nav" class="fixed inset-x-0 bottom-0 z-20 hidden border-t border-fg/10 bg-canvas/80 backdrop-blur-xl">
    <div class="mx-auto grid max-w-3xl grid-cols-6 text-[11px] font-medium text-slate-500">
      <a data-route="inicio" href="#inicio" class="flex flex-col items-center gap-0.5 py-2"><span class="text-xl">&#9678;</span>Inicio</a>
      <a data-route="horario" href="#horario" class="flex flex-col items-center gap-0.5 py-2"><span class="text-xl">&#9638;</span>Horario</a>
      <a data-route="amigos" href="#amigos" class="flex flex-col items-center gap-0.5 py-2"><span class="text-xl">&#9786;</span>Amigos</a>
      <a data-route="propuestas" href="#propuestas" class="relative flex flex-col items-center gap-0.5 py-2"><span class="text-xl">&#9993;</span>Propuestas<span id="badge" class="absolute right-[22%] top-1 hidden min-w-[18px] rounded-full bg-red-500 px-1 text-center text-[10px] leading-[18px] text-white"></span></a>
      <a data-route="notas" href="#notas" class="flex flex-col items-center gap-0.5 py-2"><span class="text-xl">&#9733;</span>Notas</a>
      <a data-route="agenda" href="#agenda" class="flex flex-col items-center gap-0.5 py-2"><span class="text-xl">&#9998;</span>Agenda</a>
    </div>
  </nav>

  <dialog id="dlg" class="w-[min(94vw,28rem)] rounded-2xl border border-fg/10 bg-sheet p-0 text-slate-700"><div id="dlg-body"></div></dialog>
  <div id="waking" class="pointer-events-none fixed inset-x-0 bottom-24 z-30 flex hidden justify-center px-4">
    <div class="toast-in rounded-full border border-fg/10 bg-sheet px-4 py-2 text-sm font-medium text-fg shadow-lg" role="status">⏳ Despertando el servidor… <span class="text-slate-500">unos segundos</span></div>
  </div>
  <div id="toast" class="pointer-events-none fixed inset-x-0 top-16 z-50 flex flex-col items-center gap-2 px-4"></div>

  <script src="/app.js"></script>
</body>
</html>
